"$schema" = 'https://starship.rs/config-schema.json'

# A minimal, fast, and clean Starship configuration.
# Optimized for performance by reducing shell calls and simplifying the layout.

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$package\
$python\
$nodejs\
$rust\
$golang\
$lua\
$line_break\
$character"""

# Use a clean right prompt for secondary information
right_format = """
$cmd_duration\
$jobs\
$time\
$status"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
# Refined Gruvbox colors (less saturated)
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_blue = '#83a598'
color_aqua = '#8ec07c'
color_green = '#b8bb26'
color_orange = '#fe8019'
color_purple = '#d3869b'
color_red = '#fb4934'
color_yellow = '#fabd2f'
color_gray = '#928374'

[username]
show_always = true
style_user = "bold color_orange"
style_root = "bold color_red"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "bold color_yellow"
format = "on [$hostname]($style) in "

[directory]
style = "bold color_blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[➜](bold color_green)"
error_symbol = "[➜](bold color_red)"

[git_branch]
symbol = " "
style = "bold color_aqua"
format = "on [$symbol$branch]($style) "

[git_status]
style = "color_aqua"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = '\$'
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_metrics]
disabled = true # High overhead in large repos

[cmd_duration]
min_time = 500
format = "took [$duration](bold color_yellow) "

[python]
symbol = " "
style = "bold color_yellow"
pyenv_prefix = "pyenv "
python_binary = ["python3", "python", "python2"]
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "bold color_green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold color_orange"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold color_aqua"
format = "via [$symbol($version )]($style)"

[lua]
symbol = " "
style = "bold color_blue"
format = "via [$symbol($version )]($style)"

[time]
disabled = false
time_format = "%R"
style = "color_gray"
format = "[$time]($style) "

[status]
disabled = false
format = '[$symbol]($style)'
symbol = "✘ "
success_symbol = ""

[jobs]
symbol = " "
style = "bold color_purple"
format = "[$symbol$number]($style) "

[memory_usage]
disabled = true # High overhead

[package]
disabled = true # Often unnecessary overhead

[os]
disabled = true

[localip]
disabled = true

[line_break]

disabled = false



[docker_context]

disabled = true



[conda]

disabled = true



[aws]

disabled = true



[gcloud]
disabled = true



[azure]

disabled = true



[terraform]

disabled = true



[php]

disabled = true



[java]

disabled = true



[kotlin]

disabled = true



[haskell]

disabled = true



[ruby]
disabled = true

[shell]
disabled = true

[shlvl]
disabled = true
