# -----------------------------------------------------------------------------
# Sunshine Configuration - dev-env
#
# Optimized for AMD Radeon 780M iGPU (Beelink SER9 / AMD Ryzen 7)
# Uses VAAPI hardware encoding for low-latency streaming.
#
# Sunshine docs: https://docs.lizardbyte.dev/projects/sunshine/
#
# IMPORTANT: After first run, configure credentials via web UI at:
#   https://localhost:47990
# -----------------------------------------------------------------------------

# =============================================================================
# Network Configuration
# =============================================================================

# Bind only to Tailscale interface for security
# Find your Tailscale IP with: tailscale ip -4
# Leave commented to bind to all interfaces initially, then restrict
# origin_web_ui_allowed = tailscale0

# Port configuration (defaults, but explicit)
port = 47989

# =============================================================================
# Encoder Configuration - AMD VAAPI
# =============================================================================

# Use VAAPI for AMD hardware encoding (780M supports this)
encoder = vaapi

# AMD-specific VAAPI settings
# The 780M uses RDNA 3 architecture with excellent encode quality
vaapi_device = /dev/dri/renderD128

# Prefer H.265/HEVC for better quality at same bitrate (if client supports)
# hevc_mode = 2  # 0=never, 1=prefer, 2=always (if client supports)

# =============================================================================
# Video Quality Settings
# =============================================================================

# Target framerate (60 for smooth remote desktop)
fps = [30, 60]

# Resolution options (client negotiates based on network)
resolutions = [
    1920x1080,
    2560x1440,
    3840x2160
]

# Bitrate settings (Kbps) - adjust based on network
# Higher = better quality, more bandwidth
# min_bitrate = 5000
# max_bitrate = 50000

# =============================================================================
# Audio Configuration
# =============================================================================

# Audio capture for remote streaming
audio_sink = default

# =============================================================================
# Input Configuration
# =============================================================================

# Enable all input types for remote control
keyboard = enabled
mouse = enabled
gamepad = enabled

# =============================================================================
# Capture Method
# =============================================================================

# For Wayland/Hyprland, use wlroots capture
# This captures the Wayland compositor output directly
capture = wlr

# Fallback to KMS if wlr capture fails (works without compositor)
# capture = kms

# =============================================================================
# Security
# =============================================================================

# Require PIN pairing for new clients
# Set credentials via web UI: https://localhost:47990
# username and password are set via web UI, not config file

# =============================================================================
# Logging
# =============================================================================

# Log level for troubleshooting
# min_log_level = info

# =============================================================================
# Advanced Settings
# =============================================================================

# Number of threads for encoding (auto-detect is usually fine)
# threads = 0

# Key frame interval (lower = faster recovery from packet loss)
# key_frame_interval = 100
