# -----------------------------------------------------------------------------
# Hyprland Remote/Headless Configuration - dev-env
#
# Configuration for running Hyprland on a remote-first workstation
# (e.g., Beelink SER9 with AMD 780M iGPU)
#
# Source this from ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/devenv-remote.conf
#
# Features:
# - Virtual output for headless operation (no physical monitor required)
# - Physical monitor support when plugged in
# - Optimized for Sunshine/Moonlight streaming
# -----------------------------------------------------------------------------

# =============================================================================
# Virtual Output (Headless Mode)
# =============================================================================
# Creates a virtual display that works without a physical monitor.
# Sunshine can capture this for remote streaming.
#
# Hyprland creates virtual outputs automatically when using headless backend,
# but we can also use the HEADLESS-1 output explicitly.

# Fallback virtual monitor (used when no physical display detected)
# Resolution optimized for remote work - 2560x1440 is a good balance
# Can also use 1920x1080 for lower bandwidth, or 3840x2160 for 4K
monitor = HEADLESS-1, 2560x1440@60, 0x0, 1

# =============================================================================
# Physical Monitor Support
# =============================================================================
# When a physical monitor is connected, use it normally.
# This allows plugging in a monitor for local work.

# Prefer connected monitors over virtual (HDMI, DP)
# These rules apply when physical monitors are detected
monitor = HDMI-A-1, preferred, auto, 1
monitor = DP-1, preferred, auto, 1
monitor = DP-2, preferred, auto, 1

# Disable virtual output when physical monitor is connected
# (Hyprland handles this automatically in most cases)

# =============================================================================
# Remote Streaming Optimizations
# =============================================================================

# Disable animations for better streaming performance (optional)
# Uncomment if you experience lag during remote sessions
# animations {
#     enabled = false
# }

# Reduce blur for better encode performance (optional)
# decoration {
#     blur {
#         enabled = false
#     }
# }

# =============================================================================
# Cursor Settings for Remote
# =============================================================================
# Ensure cursor is visible in remote sessions

cursor {
    # Keep cursor visible even when idle (important for remote)
    inactive_timeout = 0

    # Disable cursor hiding on key press (helps with remote input)
    hide_on_key_press = false
}

# =============================================================================
# Input Settings for Remote
# =============================================================================
# Optimize for remote input (Moonlight/Sunshine pass through input)

input {
    # Disable mouse acceleration for precise remote control
    accel_profile = flat

    # Natural scroll (consistent with most client systems)
    # touchpad {
    #     natural_scroll = true
    # }
}

# =============================================================================
# Misc Settings
# =============================================================================

misc {
    # Disable splash screen (cleaner remote startup)
    disable_splash = true

    # Disable logo (cleaner remote startup)
    disable_hyprland_logo = true

    # Allow variable refresh rate (good for streaming)
    vrr = 1

    # Don't focus windows on mouse hover (better for remote)
    # Uncomment if you prefer click-to-focus
    # focus_on_activate = false
}

# =============================================================================
# Autostart for Remote Session
# =============================================================================
# These run when Hyprland starts

# Start Sunshine for remote access (if not started by systemd)
# exec-once = sunshine

# Ensure Tailscale is connected (if not managed by systemd)
# exec-once = tailscale up --accept-routes
